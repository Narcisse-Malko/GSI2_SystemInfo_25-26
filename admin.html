<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSI2 24-25</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .gen { color: red; margin: 1px; }
        .liens { display: flex; justify-content: space-between; margin-top: 5px; }
        .result { margin-bottom: 10px; padding: 10px; border: 1px solid #ddd; }
        .argu { border-top: thick double #32a1ce; padding: 6px; margin-top: 10px; list-style: none; }
        .etu { border-top: thick double #ce3232; padding: 6px; margin-bottom: 20px; }
        .btn-export {
            background-color: #4CAF50; border: none; color: white; padding: 8px 16px;
            text-align: center; text-decoration: none; display: inline-block;
            font-size: 14px; margin-top: 10px; cursor: pointer; border-radius: 4px;
        }
        .btn-export:hover { background-color: #45a049; }
        .mermaid { background-color: white; overflow: auto; }
    </style>
</head>
<body>
    <h1 id="nomAuteur">Travaux des étudiants pour le cours GSI 2 : Système d'information et développement Web</h1>
    <div id="data-container"></div>

    <script>
        // Load JSON data
        d3.csv("https://docs.google.com/spreadsheets/d/e/2PACX-1vTBQyz85rNI_H2ggOJzro19uGCFCRqrJHJXdFGlyq6aCxo6qlBn66pK1Bgn6ee2VZW_YGPprJIikyaU/pub?gid=755898939&single=true&output=csv").then(function(data) {
            var container = d3.select("#data-container");
            let divEtu = container.selectAll("div").data(data).enter().append("div")
                    .attr("id", d => "etu" + d["Votre identifiant omeka"]).attr("class", "etu");
            divEtu.append("h2").text(d => d["Votre nom et prénom"]);
            
            let liensEtu = divEtu.append('div').attr('id', (d, i) => "liensEtu" + i).attr('class', 'liens');         
            liensEtu.append("a").attr("href", d => "https://github.com/" + d["Votre login github"] + "/GSI2_SystemInfo_25-26/").text(d => d["Votre login github"] + " sources exercices");
            liensEtu.append("a").attr("href", d => "https://" + d["Votre login github"] + ".github.io/GSI2_SystemInfo_25-26/test.html").text(d => "Page Test");
            liensEtu.append('div').append('button').text('Voir les arguments').on('click', showArguments);
        }).catch(error => console.error('Error loading data:', error));

        function showArguments(e, d) {
            d3.select('#etu' + d["Votre identifiant omeka"]).select('ul').remove();
            d3.json("https://argument.generateur.art/api/items?resource_class_id=107&owner_id=" + d["Votre identifiant omeka"]).then(rs => {
                let ulEtuArgu = d3.select('#etu' + d["Votre identifiant omeka"]).append('ul');
                let argus = ulEtuArgu.selectAll('li').data(rs).enter().append('li').attr('class', 'argu').attr('id', d => 'argu' + d['o:id']);
                
                let liensArgu = argus.append('div').attr('class', 'liens');         
                let propsArgu = argus.append('div').attr('class', 'props');
                let props = ["o:created", "dcterms:description", "argu:hasFamilleArgu", "argu:hasRegistre", "dcterms:subject"];
                
                propsArgu.append('ul').selectAll('li').data(d => props.map(p => ({'p': p, d: d}))).enter().append('li')
                    .selectAll('p').data((d) => Array.isArray(d.d[d.p]) ? d.d[d.p] : [d.d[d.p]]).enter().append('p')
                    .html(d => d ? '<span>' + ((d.property_label ? d.property_label + ' = ' : '') + (d.display_title || d["@value"])) + '</span>' : 'vide');

                argus.append('div').attr('class', 'liens').selectAll('span').data(d => d["argu:generateur"] ? d["argu:generateur"].slice(1) : []).enter().append('span')
                    .html(d => d.type == 'resource' ? "<a target='_blank' href='" + d['@id'].replace('api/items', 'admin/item') + "'>" + d.display_title + "</a>" : d['@value']);

                liensArgu.append('a').attr('href', d => 'https://argument.generateur.art/admin/item/' + d['o:id']).attr('target', '_blank').text(d => d["o:title"]);
                liensArgu.append('button').text('Générer un argument').on('click', genereArgument);
                liensArgu.append('button').text('Générer la carte des arguments').on('click', genereCartoArgument);
                argus.append('div').attr('id', d => "resultArgu" + d['o:id']).attr('class', 'result');
            });
        }

        function genereArgument(e, arg) {
            let argu = d3.select('#resultArgu' + arg['o:id']);
            argu.select('div').remove();            
            let divTxtArgu = argu.append('div');
            divTxtArgu.selectAll('span').data(arg["argu:generateur"]).enter().append('span')
                .attr('id', (g, i) => { g.idSpan = 'span' + arg['o:id'] + '_' + i; return g.idSpan; })
                .text((g, i) => { if (i > 0) { if (g.type == 'literal') return g['@value']; if (g.type == 'resource') getAleaDescription(g); } });
        }
        
        let diagramCode;
        
        async function genereCartoArgument(e, arg) {
            diagramCode = 'flowchart TB\n';
            await buildMermaidDiagram(arg);

            let resultDiv = d3.select('#resultArgu' + arg['o:id']);
            resultDiv.html(''); // Nettoyage complet

            // Création d'un conteneur spécifique pour mermaid
            let mermaidId = 'mermaid-container-' + arg['o:id'];
            resultDiv.append('div')
                .attr('class', 'mermaid')
                .attr('id', mermaidId)
                .text(diagramCode);

            // Bouton d'export
            resultDiv.append('button')
                .attr('class', 'btn-export')
                .text('Exporter en JPEG')
                .on('click', function() {
                    // On passe directement l'ID du conteneur
                    exportToJpeg(mermaidId, 'argument_' + arg['o:id']);
                });

            // Initialisation Mermaid
            if (typeof mermaid === 'undefined') {
                let script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/mermaid@latest/dist/mermaid.min.js';
                script.onload = () => {
                    mermaid.initialize({ startOnLoad: true, securityLevel: 'loose' });
                    mermaid.run();
                };
                document.head.appendChild(script);
            } else {
                mermaid.run();
            }
        }

        async function buildMermaidDiagram(arg, parentId = null) {
            const currentId = 'arg' + arg['o:id'];
            diagramCode += `    ${currentId}["${arg['o:title']}"]\n`;
            
            let rootId, txtId, resId, prevIds = [];
            if (arg["argu:generateur"]) {
                for (let index = 0; index < arg["argu:generateur"].length; index++) {
                    const element = arg["argu:generateur"][index];
                    if (index == 0) {
                        rootId = 'gen' + element['o:id'];
                        diagramCode += `    ${rootId}["${element["@value"]}"]\n`;
                        diagramCode += `    ${currentId} --> ${rootId}\n`;
                    } else {
                        if (element.type === 'resource') {
                            resId = 'res' + element['o:id'] + '_' + element.value_resource_id;
                            diagramCode += `    ${resId}@{ shape: docs, label: "${element.display_title}" }\n`;                             
                            if (prevIds.length) prevIds.forEach(pi => diagramCode += `    ${pi} --> ${resId}\n`);
                            else diagramCode += `    ${rootId} --> ${resId}\n`;
                            
                            try {
                                let posis = await d3.json(element['@id']);
                                prevIds = [];
                                if (posis && posis["dcterms:description"]) {
                                    posis["dcterms:description"].forEach((p, i) => {
                                        let posiId = 'posi' + element.value_resource_id + '_' + i;
                                        let safeLabel = p['@value'].replace(/"/g, "'").replace(/\n/g, " "); 
                                        diagramCode += `    ${posiId}["${safeLabel}"]\n`;
                                        diagramCode += `    ${resId} --> ${posiId}\n`;
                                        prevIds.push(posiId);                                     
                                    });
                                }
                            } catch (err) { console.log("Erreur chargement sous-ressource", err); }
                        } else {
                            txtId = 'txt_' + index + '_' + arg['o:id'];
                            let safeValue = element["@value"].replace(/"/g, "'");
                            diagramCode += `    ${txtId}@{ shape: stadium, label: "${safeValue}" }\n`;
                            if (prevIds.length) prevIds.forEach(pi => diagramCode += `    ${pi} --> ${txtId}\n`);
                            else diagramCode += `    ${rootId} --> ${txtId}\n`;
                            prevIds = [txtId];
                        }
                    }
                }
            }
            if (parentId) diagramCode += `    ${parentId} --> ${currentId}\n`;
        }

        function getAleaDescription(d) {
            d3.json(d['@id']).then(rs => {
                let listeDesc = rs['dcterms:description'],
                alea = Math.floor(Math.random() * listeDesc.length), choixDesc = listeDesc[alea];
                d3.select('#' + d.idSpan).attr("class", "gen").text(choixDesc['@value'] + " (" + (alea + 1) + "/" + listeDesc.length + ") ");
            });
        }         

        /**
         * Fonction robuste pour exporter le diagramme Mermaid en JPEG
         */
        function exportToJpeg(containerId, fileName) {
            console.log("Tentative d'export pour : " + containerId);
            
            const container = document.getElementById(containerId);
            if(!container) { console.error("Conteneur introuvable"); return; }
            
            const svgElement = container.querySelector('svg');
            if (!svgElement) { alert("Le diagramme n'est pas encore prêt. Réessayez dans 2 secondes."); return; }

            // 1. Récupérer les dimensions réelles (Bounding Box)
            const bbox = svgElement.getBoundingClientRect();
            const width = bbox.width;
            const height = bbox.height;
            console.log("Dimensions détectées : ", width, height);

            if(width === 0 || height === 0) {
                alert("Erreur de dimension. Le diagramme est invisible.");
                return;
            }

            // 2. Cloner le SVG pour le manipuler sans casser l'affichage
            const clonedSvg = svgElement.cloneNode(true);
            
            // 3. FORCER les attributs width et height sur le clone (Crucial pour le Blob)
            clonedSvg.setAttribute("width", width);
            clonedSvg.setAttribute("height", height);
            clonedSvg.style.backgroundColor = "white"; // Fond blanc CSS au cas où

            // 4. Sérialiser
            const serializer = new XMLSerializer();
            let svgString = serializer.serializeToString(clonedSvg);

            // 5. Créer l'image
            const img = new Image();
            const svgBlob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);
            
            img.onload = function() {
                console.log("Image chargée, création du Canvas...");
                const canvas = document.createElement('canvas');
                // On double la résolution pour que ce soit net
                const scale = 2;
                canvas.width = width * scale;
                canvas.height = height * scale;
                
                const context = canvas.getContext('2d');
                context.scale(scale, scale);

                // Fond blanc explicite
                context.fillStyle = '#FFFFFF';
                context.fillRect(0, 0, width, height);

                // Dessin
                context.drawImage(img, 0, 0, width, height);

                // Téléchargement
                const link = document.createElement('a');
                link.download = fileName + '.jpeg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                URL.revokeObjectURL(url);
                console.log("Export terminé.");
            };
            
            img.onerror = function(e) {
                console.error("Erreur lors du chargement de l'image SVG", e);
                alert("Erreur technique lors de la conversion de l'image.");
            };

            img.src = url;
        }
    </script>
</body>
</html>
