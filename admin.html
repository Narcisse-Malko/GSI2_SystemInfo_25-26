<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSI2 24-25</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .gen { color: red; margin: 1px; }
        .liens { display: flex; justify-content: space-between; margin-top: 5px; }
        .result { margin-bottom: 10px; padding: 10px; border: 1px solid #ddd; }
        .argu { border-top: thick double #32a1ce; padding: 6px; margin-top: 10px; list-style: none; }
        .etu { border-top: thick double #ce3232; padding: 6px; margin-bottom: 20px; }
        
        /* Nouveau style pour le bouton */
        .btn-export {
            background-color: #007bff; /* Bleu standard */
            border: none;
            color: white;
            padding: 8px 16px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-family: sans-serif;
        }
        .btn-export:hover { background-color: #0056b3; }
        
        .mermaid { background-color: white; overflow: auto; padding: 10px;}
    </style>
</head>
<body>
    <h1 id="nomAuteur">Travaux des étudiants pour le cours GSI 2 : Système d'information et développement Web</h1>
    <div id="data-container"></div>

    <script>
        // --- 1. CHARGEMENT DES DONNÉES ---
        d3.csv("https://docs.google.com/spreadsheets/d/e/2PACX-1vTBQyz85rNI_H2ggOJzro19uGCFCRqrJHJXdFGlyq6aCxo6qlBn66pK1Bgn6ee2VZW_YGPprJIikyaU/pub?gid=755898939&single=true&output=csv")
        .then(function(data) {
            var container = d3.select("#data-container");
            
            let divEtu = container.selectAll("div").data(data).enter().append("div")
                .attr("id", d => "etu" + d["Votre identifiant omeka"])
                .attr("class", "etu");
            
            divEtu.append("h2").text(d => d["Votre nom et prénom"]);
            
            let liensEtu = divEtu.append('div').attr('class', 'liens');         
            liensEtu.append("a")
                .attr("href", d => "https://github.com/" + d["Votre login github"] + "/GSI2_SystemInfo_25-26/")
                .text(d => d["Votre login github"] + " sources");
            liensEtu.append("a")
                .attr("href", d => "https://" + d["Votre login github"] + ".github.io/GSI2_SystemInfo_25-26/test.html")
                .text(d => "Page Test");
            
            liensEtu.append('div').append('button')
                .text('Voir les arguments')
                .on('click', showArguments);

        }).catch(error => console.error('Erreur chargement CSV:', error));

        // --- 2. AFFICHAGE DES ARGUMENTS ---
        function showArguments(e, d) {
            d3.select('#etu' + d["Votre identifiant omeka"]).select('ul').remove();
            
            d3.json("https://argument.generateur.art/api/items?resource_class_id=107&owner_id=" + d["Votre identifiant omeka"])
            .then(rs => {
                let ulEtuArgu = d3.select('#etu' + d["Votre identifiant omeka"]).append('ul');
                let argus = ulEtuArgu.selectAll('li').data(rs).enter().append('li')
                    .attr('class', 'argu')
                    .attr('id', d => 'argu' + d['o:id']);
                
                let liensArgu = argus.append('div').attr('class', 'liens');         
                let propsArgu = argus.append('div').attr('class', 'props');
                let props = ["o:created", "dcterms:description", "argu:hasFamilleArgu", "argu:hasRegistre", "dcterms:subject"];
                
                propsArgu.append('ul').selectAll('li').data(d => props.map(p => ({'p': p, d: d}))).enter().append('li')
                    .selectAll('p').data((d) => Array.isArray(d.d[d.p]) ? d.d[d.p] : [d.d[d.p]]).enter().append('p')
                    .html(d => d ? '<span>' + ((d.property_label ? d.property_label + ' = ' : '') + (d.display_title || d["@value"])) + '</span>' : 'vide');

                argus.append('div').attr('class', 'liens').selectAll('span')
                    .data(d => d["argu:generateur"] ? d["argu:generateur"].slice(1) : []).enter().append('span')
                    .html(d => d.type == 'resource' ? "<a target='_blank' href='" + d['@id'].replace('api/items', 'admin/item') + "'>" + d.display_title + "</a>" : d['@value']);

                liensArgu.append('a').attr('href', d => 'https://argument.generateur.art/admin/item/' + d['o:id']).attr('target', '_blank').text(d => d["o:title"]);
                liensArgu.append('button').text('Générer un argument').on('click', genereArgument);
                liensArgu.append('button').text('Générer la carte des arguments').on('click', genereCartoArgument);
                
                argus.append('div').attr('id', d => "resultArgu" + d['o:id']).attr('class', 'result');
            });
        }

        // --- 3. GÉNÉRATION TEXTUELLE ---
        function genereArgument(e, arg) {
            let argu = d3.select('#resultArgu' + arg['o:id']);
            argu.select('div').remove();            
            let divTxtArgu = argu.append('div');
            divTxtArgu.selectAll('span').data(arg["argu:generateur"]).enter().append('span')
                .attr('id', (g, i) => { g.idSpan = 'span' + arg['o:id'] + '_' + i; return g.idSpan; })
                .text((g, i) => { 
                    if (i > 0) { 
                        if (g.type == 'literal') return g['@value']; 
                        if (g.type == 'resource') getAleaDescription(g); 
                    } 
                });
        }
        
        // --- 4. GÉNÉRATION ET EXPORT DIAGRAMME ---
        let diagramCode;
        
        async function genereCartoArgument(e, arg) {
            diagramCode = 'flowchart TB\n';
            await buildMermaidDiagram(arg);

            let resultDiv = d3.select('#resultArgu' + arg['o:id']);
            resultDiv.html(''); 

            let mermaidId = 'mermaid-container-' + arg['o:id'];
            
            // Conteneur Mermaid
            resultDiv.append('div')
                .attr('class', 'mermaid')
                .attr('id', mermaidId)
                .text(diagramCode);

            // Bouton d'export SVG (Format Vectoriel)
            let btn = resultDiv.append('button')
                .attr('class', 'btn-export')
                .text('Télécharger le diagramme (SVG)')
                .style('display', 'none') 
                .on('click', function() {
                    exportToSvg(mermaidId, 'argument_' + arg['o:id']);
                });

            if (typeof mermaid === 'undefined') {
                let script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/mermaid@latest/dist/mermaid.min.js';
                script.onload = () => runMermaid(btn);
                document.head.appendChild(script);
            } else {
                runMermaid(btn);
            }
        }

        function runMermaid(btn) {
            mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
            mermaid.run().then(() => {
                btn.style('display', 'inline-block');
            });
        }

        async function buildMermaidDiagram(arg, parentId = null) {
            const currentId = 'arg' + arg['o:id'];
            const safeTitle = arg['o:title'].replace(/"/g, "'");
            diagramCode += `    ${currentId}["${safeTitle}"]\n`;
            
            let rootId, txtId, resId, prevIds = [];
            if (arg["argu:generateur"]) {
                for (let index = 0; index < arg["argu:generateur"].length; index++) {
                    const element = arg["argu:generateur"][index];
                    if (index == 0) {
                        rootId = 'gen' + element['o:id'];
                        diagramCode += `    ${rootId}["${element["@value"].replace(/"/g, "'")}"]\n`;
                        diagramCode += `    ${currentId} --> ${rootId}\n`;
                    } else {
                        if (element.type === 'resource') {
                            resId = 'res' + element['o:id'] + '_' + element.value_resource_id;
                            diagramCode += `    ${resId}@{ shape: docs, label: "${element.display_title.replace(/"/g, "'")}" }\n`;                             
                            if (prevIds.length) prevIds.forEach(pi => diagramCode += `    ${pi} --> ${resId}\n`);
                            else diagramCode += `    ${rootId} --> ${resId}\n`;
                            
                            try {
                                let posis = await d3.json(element['@id']);
                                prevIds = [];
                                if (posis && posis["dcterms:description"]) {
                                    posis["dcterms:description"].forEach((p, i) => {
                                        let posiId = 'posi' + element.value_resource_id + '_' + i;
                                        let safeLabel = p['@value'].replace(/"/g, "'").replace(/\n/g, "<br>"); 
                                        diagramCode += `    ${posiId}["${safeLabel}"]\n`;
                                        diagramCode += `    ${resId} --> ${posiId}\n`;
                                        prevIds.push(posiId);                                     
                                    });
                                }
                            } catch (err) { console.log("Erreur chargement sous-ressource", err); }
                        } else {
                            txtId = 'txt_' + index + '_' + arg['o:id'];
                            let safeValue = element["@value"].replace(/"/g, "'");
                            diagramCode += `    ${txtId}@{ shape: stadium, label: "${safeValue}" }\n`;
                            if (prevIds.length) prevIds.forEach(pi => diagramCode += `    ${pi} --> ${txtId}\n`);
                            else diagramCode += `    ${rootId} --> ${txtId}\n`;
                            prevIds = [txtId];
                        }
                    }
                }
            }
            if (parentId) diagramCode += `    ${parentId} --> ${currentId}\n`;
        }

        function getAleaDescription(d) {
            d3.json(d['@id']).then(rs => {
                let listeDesc = rs['dcterms:description'],
                alea = Math.floor(Math.random() * listeDesc.length), choixDesc = listeDesc[alea];
                d3.select('#' + d.idSpan).attr("class", "gen").text(choixDesc['@value'] + " (" + (alea + 1) + "/" + listeDesc.length + ") ");
            });
        }         

        /**
         * FONCTION D'EXPORT SVG (La solution fiable)
         */
        function exportToSvg(containerId, fileName) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const svg = container.querySelector('svg');
            
            // Sérialisation du SVG
            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svg);

            // Ajout des namespaces XML si manquants (pour compatibilité hors navigateur)
            if(!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)){
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }
            if(!source.match(/^<svg[^>]+xmlns:xlink/)){
                source = source.replace(/^<svg/, '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
            }

            // En-tête XML standard
            source = '<?xml version="1.0" standalone="no"?>\r\n' + source;

            // Création du lien de téléchargement
            const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
            
            const link = document.createElement("a");
            link.download = fileName + ".svg";
            link.href = url;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

    </script>
</body>
</html>
